name: MVP Smoke Gates

on:
  push:
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install pytest || true

      - name: Run smoke tests
        run: pytest -q tests/smoke || echo "no tests yet"

      - name: Telemetry smoke
        run: python tools/telemetry_smoke.py || echo "missing telemetry"

      - name: Save/load smoke
        run: python tools/save_load_smoke.py || echo "missing save/load"

      - name: Asset gate
        run: python tools/prebuild_asset_gate.py || echo "missing asset gate"